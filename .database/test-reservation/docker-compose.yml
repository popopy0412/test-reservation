version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: test-reservation-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: test_reservation_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data_2:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - test_reservation_network

volumes:
  mysql_data_2:

networks:
  test_reservation_network:
    driver: bridge