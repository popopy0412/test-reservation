spring:
    datasource:
        url: jdbc:mysql://localhost:3307/test_reservation_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
        username: root
        password: 1234
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
            minimum-idle: 5
            maximum-pool-size: 20
            idle-timeout: 30000 # 30초
            max-lifetime: 600000 # 10분

    jpa:
        database: mysql
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                dialect: org.hibernate.dialect.MySQL8Dialect
                format_sql: true
                show_sql: false


server:
    port: 8081

logging:
    level:
        org.hibernate.resource.transaction: DEBUG
        org.hibernate.engine.transaction: DEBUG
        org.springframework.transaction: DEBUG
        org.springframework.orm.jpa: DEBUG